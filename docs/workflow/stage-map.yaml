# =============================================================================
# CANONICAL WORKFLOW + ROUTING DEFINITION — Archipelago
# =============================================================================
# The ONLY authoritative definition of the delivery workflow: stage ids, order,
# owners, transitions, loop-backs and human gates. Prose (stages.md, AGENTS.md,
# Skill docs) explains this file and MUST stay consistent with it.
#
# Two levels:
#   epic_stages   run once per epic: cut the epic into small stories.
#   story_stages  run once per story, one active story at a time.
#
# Artifact references are registry KEYS from artifact-paths.yaml; never paths.
#
# Result contract (artifact-lifecycle.md):
#   PASS             -> advance to `next`
#   CHANGES_REQUIRED -> route to loop_back[<key>]; the key MUST exist here
#   BLOCKED          -> hold at the current stage, surface blocking_issues
#
# Only story-orchestrator records transitions (workflow-state.yaml +
# history.jsonl). Stage Skills never mutate workflow state.
# =============================================================================

version: 2
status: active
max_attempts: 3 # runs of one stage in a row; more → BLOCKED until a human says continue
workflow: epic-delivery

commands:
  epic: '/so:epic <Epic> [feedback]' # activate an epic, or amend its approved backlog
  start: '/so:start <StoryId>' # activate a READY story of the active epic
  next: '/so:next [continue]' # run the current stage; `continue` clears an attempt limit
  status: '/so:status'
  approve: '/so:approve [comment]'
  reject: '/so:reject [target-stage] <comment>'

# -----------------------------------------------------------------------------
# Story rules (applied by BACKLOG_SYNC, checked at HUMAN_BACKLOG_APPROVAL)
# -----------------------------------------------------------------------------
story_rules:
  id_format: 'US-<epic>-<nn>-<layer>' # US-03-02-api, US-03-02-web; foundation: US-00-<nn>-<layer>
  small:
    - one user-visible behavior or one cohesive API capability
    - at most 5 acceptance criteria, each testable on its own
    - one backend module or one web feature folder
    - reviewable in one sitting (a few hundred changed lines, excluding generated code)
    - traced to BRD FR/BR IDs and epic AC IDs
  layers:
    api: >
      apps/api: domain, use cases, Prisma `app` schema, REST endpoints with
      @nestjs/swagger decorators, regenerated packages/api-client, and the
      shared validation vectors of every rule a web form mirrors (ADR-004).
    web: >
      apps/web: pages, components, forms, hooks, BFF route handlers, `bff`
      session schema, en/uk UI strings. Imports shared validation vectors,
      never writes them.
  web_depends_on_api: >
    A web story that consumes an endpoint names its api story in `depends_on`
    and may start only when that story is DONE: OpenAPI is generated from code,
    so the contract is the merged endpoint, the regenerated client and the
    shared validation vectors. A missing vector set is a contract gap. A
    contract gap found later makes the web story BLOCKED; a backlog amend
    (`/so:epic <Epic> <feedback>`) adds a new api story and a replacement web
    story that depends on it, and drops the blocked one.
  risk:
    # `risk: high` makes HUMAN_PLAN_APPROVAL mandatory. BACKLOG_SYNC proposes it,
    # the human confirms it at HUMAN_BACKLOG_APPROVAL, SPECIFICATION may raise it.
    high_when:
      - touches authentication, sessions, cookies or the BFF token boundary
      - adds or changes a Prisma migration (`app` or `bff`)
      - spans more than one backend module or runs a cross-module transaction
      - changes authorization rules or the outbox
  foundation: >
    Work no epic owns (app shell, i18n, session plumbing, Unit of Work) gets a
    US-00 id and lives under epic-00. Any epic's BACKLOG_SYNC may propose it
    when one of its stories needs it; it is delivered within that epic.

# -----------------------------------------------------------------------------
# Epic stages
# -----------------------------------------------------------------------------
epic_stages:
  BACKLOG_SYNC:
    type: automated_skill
    skill: backlog-sync
    inputs: [epic, brd, prd, design_index, adr, agents_rules, layer_rules]
    outputs: [backlog, story, epic_decisions]
    next: HUMAN_BACKLOG_APPROVAL
    does: >
      Cuts the epic into small single-layer stories, writes backlog.md (order,
      depends_on, risk, epic AC coverage, every story PROPOSED in its Status
      column) and one story.md per story. Seeds epic_decisions with product
      questions the epic leaves open. In `amend` mode it adds stories to an
      approved backlog without touching started ones. Also slices the work other
      epics' decisions hand off to this epic (`Hands off to`). Questions about project-wide conventions (error format, pagination,
      IDs, dates, logging) are proposed as ADRs, never decided here.

  HUMAN_BACKLOG_APPROVAL:
    type: human_gate
    required_artifacts: [backlog] # gets status APPROVED
    also_review: [story, epic_decisions] # read via backlog links; story status = backlog Status column
    on_approve: null # epic is IN_DELIVERY; stories become READY
    on_reject: BACKLOG_SYNC # the comment is the feedback for the next version

# -----------------------------------------------------------------------------
# Story stages, in order
# -----------------------------------------------------------------------------
story_stage_order:
  - CLARIFICATION
  - SPECIFICATION
  - SPEC_REVIEW
  - HUMAN_SPEC_APPROVAL
  - PLANNING
  - HUMAN_PLAN_APPROVAL
  - TEST_FIRST
  - IMPLEMENTATION
  - REVIEW
  - HUMAN_ACCEPTANCE
  - DONE

story_stages:
  CLARIFICATION:
    type: interactive_skill # needs a live human; Auto mode stops here
    skill: story-clarifier
    inputs:
      [
        story,
        epic,
        brd,
        prd,
        design_index,
        adr,
        epic_decisions,
        dependency_spec,
        agents_rules,
        layer_rules,
      ]
    outputs: [clarification, story, epic_decisions]
    next: SPECIFICATION
    does: >
      Answers what the repo already answers (with source), then interviews the
      human one question at a time with a recommended answer. Question
      categories follow the layer. A web story inherits its api dependency's
      decisions instead of re-asking them. Epic-wide answers go to
      epic_decisions. On the human's explicit confirmation it applies the agreed
      changes to story.md and returns PASS; without it, BLOCKED.

  SPECIFICATION:
    type: automated_skill
    skill: spec-writer
    inputs:
      [
        story,
        clarification,
        epic_decisions,
        dependency_spec,
        epic,
        brd,
        prd,
        adr,
        design_index,
        agents_rules,
        layer_rules,
      ]
    outputs: [specification]
    next: SPEC_REVIEW
    does: >
      Testable ACs (Given/When/Then) with rule IDs, then one design section per
      layer. api: endpoints, DTOs and validation, error responses, authorization,
      domain rules, Prisma changes. web: route, components, mockup panels and
      corrections, UI states (loading/empty/error/success), en/uk keys, BFF
      calls. States `risk` again and raises it when story_rules.risk applies.

  SPEC_REVIEW:
    type: automated_skill
    skill: spec-reviewer
    fresh_context: true # runs in a subagent that did not write the spec
    inputs:
      [
        story,
        clarification,
        specification,
        epic_decisions,
        dependency_spec,
        epic,
        brd,
        prd,
        adr,
        design_index,
        agents_rules,
        layer_rules,
      ]
    outputs: [specification_review]
    next: HUMAN_SPEC_APPROVAL
    loop_back:
      changes_required: SPECIFICATION
      clarification_gap: CLARIFICATION

  HUMAN_SPEC_APPROVAL:
    type: human_gate
    required_artifacts: [specification, specification_review]
    on_approve: PLANNING
    on_reject: SPECIFICATION
    reject_targets: [CLARIFICATION, SPECIFICATION]

  PLANNING:
    type: automated_skill
    skill: implementation-planner
    inputs:
      [
        story,
        specification,
        specification_review,
        epic_decisions,
        dependency_spec,
        adr,
        agents_rules,
        layer_rules,
      ]
    outputs: [implementation_plan]
    next: HUMAN_PLAN_APPROVAL
    does: >
      Files to add or change, impact on existing code, migration steps, and the
      AC -> test matrix (test level and file per AC). Applies the code quality
      bar: no layers, abstractions or options the story does not need.
    loop_back:
      specification_gap: SPECIFICATION

  HUMAN_PLAN_APPROVAL:
    type: human_gate
    required_when: 'story risk is high' # otherwise the orchestrator skips it and records the skip
    required_artifacts: [implementation_plan]
    on_approve: TEST_FIRST
    on_reject: PLANNING
    reject_targets: [SPECIFICATION, PLANNING]

  TEST_FIRST:
    type: automated_skill
    skill: test-writer
    inputs:
      [story, specification, implementation_plan, dependency_spec, adr, agents_rules, layer_rules]
    outputs: [test_report]
    next: IMPLEMENTATION
    does: >
      Writes the tests from the AC -> test matrix and runs them; they must fail
      for the right reason (red). On a re-entry after IMPLEMENTATION only tests
      for behavior that is still missing must be red. Vitest in both apps, Testing Library in web
      (ADR-001), api e2e for HTTP flows.
    loop_back:
      plan_gap: PLANNING
      specification_gap: SPECIFICATION

  IMPLEMENTATION:
    type: automated_skill
    skill_by_layer:
      api: nest-implementor
      web: next-implementor
    inputs:
      [
        story,
        specification,
        implementation_plan,
        test_report,
        epic_decisions,
        dependency_spec,
        design_index,
        agents_rules,
        layer_rules,
      ]
    outputs: [implementation_report]
    next: REVIEW
    does: >
      Makes the tests pass (green) following the plan and AGENTS.md (root and
      the layer's app). Never edits tests to hide a defect. Regenerates
      packages/api-client when an api story changes an endpoint.
    loop_back:
      partial: IMPLEMENTATION
      plan_gap: PLANNING

  REVIEW:
    type: automated_skill
    skill: story-reviewer
    fresh_context: true
    inputs:
      [
        story,
        specification,
        implementation_plan,
        test_report,
        implementation_report,
        dependency_spec,
        agents_rules,
        layer_rules,
      ]
    outputs: [review]
    next: HUMAN_ACCEPTANCE
    checks: # run by script; results recorded verbatim in `review`
      - pnpm db:up
      - pnpm --filter @archipelago/api prisma:generate
      - pnpm turbo run lint typecheck test build
      - pnpm --filter @archipelago/api test:e2e # api stories touching HTTP flows
    does: >
      One review in three parts. Correctness: every AC covered by a passing test,
      the diff matches the spec and plan. Security: BFF boundary and token
      isolation, cookies (CSRF, fixation, revocation), NestJS authorization on
      every resource, `app`/`bff` schema isolation, secrets and logging
      (AGENTS.md §3, §7). Readability: the code quality bar (AGENTS.md §5).
    loop_back:
      implementation_issues: IMPLEMENTATION
      test_gap: TEST_FIRST
      plan_gap: PLANNING
      specification_gap: SPECIFICATION

  HUMAN_ACCEPTANCE:
    type: human_gate
    required_artifacts: [review]
    meaning: >
      A human reviews the diff and the review and accepts the story. What
      happens in Git afterwards is open (stages.md, OQ-8).
    on_approve: DONE
    on_reject: IMPLEMENTATION
    reject_targets: [SPECIFICATION, PLANNING, TEST_FIRST, IMPLEMENTATION]

  DONE:
    type: terminal
    owner: story-orchestrator
    does: >
      Sets the story DONE in backlog.md, clears the active story and appends to
      history. Artifacts stay in place. When every story of the epic is DONE or
      DROPPED, the epic becomes DONE.

# -----------------------------------------------------------------------------
# Rules
# -----------------------------------------------------------------------------
# Inputs: `dependency_spec` is the api dependency's `specification`; it is
# absent (and skipped) for api stories and web stories without depends_on.
# Every story stage from CLARIFICATION to REVIEW lists it: the web spec, plan,
# tests, code and review are all checked against the same api contract.
#
# `inputs` is exactly what the stage's Skill reads, no more and no less: the
# orchestrator passes these paths, the artifact lists them in front matter and
# staleness checks them. A Skill that needs another document gets it added
# here first. Code, tests and generated clients are read freely and not listed.
# `design_index` is passed to web stories only; it covers the mockup images it
# lists (docs/design/mockups/), which are read with it and not listed apart.
# `prd` is context with the lowest precedence (BRD -> epic -> PRD, AGENTS.md
# §5.1): MVP scope, principles, journeys, release order. A PRD statement that
# contradicts the BRD or the epic is not a requirement: the higher source wins
# and the Skill records it as "PRD drift" for the owner; it never blocks.
# BACKLOG_SYNC also scans every docs/stories/epic-*/backlog.md (IDs) and
# decisions.md (Hands off to); they belong to other epics and are not pinned.
# Project documents (epic, brd, design_index, adr, agents_rules, layer_rules)
# are read-only inputs. `layer_rules` resolves to the list for story.layer
# (both lists at BACKLOG_SYNC); every file in it is passed and read.
#
# Loop-backs: a Skill may name only a key under its stage's `loop_back`. A human
# rejection goes to `on_reject`, or to a stage named in `reject_targets`. An
# unknown key or target holds the stage as BLOCKED pending a human decision.
# A stage run more than `max_attempts` times in a row is BLOCKED until a human
# runs `/so:next continue` (attempt resets to 1).
#
# Human gates: a review PASS is never approval. Only /so:approve passes a gate.
