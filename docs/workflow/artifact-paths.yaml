# =============================================================================
# CANONICAL ARTIFACT PATH REGISTRY — Archipelago
# =============================================================================
# The single authoritative source for where every workflow artifact lives and
# who writes it. Skills resolve locations from here, never from hard-coded
# paths; an example path in a Skill must say this file is authoritative.
#
# Layout: one folder per epic, one folder per story inside it, so everything
# about an epic or a story is in one place.
#
#   {epic}     two-digit epic number: 03 (00 = foundation stories). Epic-level
#              artifacts (backlog, epic_decisions) take it from the ACTIVE epic in
#              workflow-state.yaml; story folders take it from the story ID. So
#              US-00-02-api delivered in EPIC-01 lives in epic-00/ but reads and
#              writes epic-01/decisions.md and its status in epic-01/backlog.md.
#   {story_id} US-<epic>-<nn>-<layer>, e.g. US-03-02-api (stage-map story_rules)
#
# `owner` creates and versions the artifact. `also_written_by` may change only
# the part named in `scope`. Everyone else reads.
#
# Related: stage-map.yaml (routing), artifact-schema.md (front matter),
# artifact-lifecycle.md (statuses), state-schema.md (workflow state).
# =============================================================================

version: 2

# --- Project documents: read-only inputs, no workflow owner -----------------
project_documents:
  agents_rules: AGENTS.md
  brd: docs/product/archipelago-business-requirements.md
  prd: docs/product/Archipelago_PRD_v1.2.md
  epic: docs/epics/EPIC-{epic}_*.md
  design_index: docs/design/README.md
  mockups: docs/design/mockups/
  adr: docs/adr/ADR-*.md

artifacts:
  # --- Epic level ------------------------------------------------------------
  backlog:
    pattern: docs/stories/epic-{epic}/backlog.md
    owner: backlog-sync
    also_written_by:
      - { writer: story-orchestrator, scope: 'Status column of the story table' }
    note: >
      The epic's story list in delivery order (id, layer, title, depends_on,
      risk, status) and the epic AC coverage table. Also the story catalog:
      there is no separate catalog file.

  epic_decisions:
    pattern: docs/stories/epic-{epic}/decisions.md
    owner: backlog-sync
    also_written_by:
      - { writer: story-clarifier, scope: 'append decisions, resolve OPEN ones' }
    note: >
      Product decisions shared by the stories of one epic, so a web story
      inherits what its api story settled. Project-wide conventions go to ADRs.

  # --- Story level -----------------------------------------------------------
  story:
    pattern: docs/stories/epic-{epic}/{story_id}/story.md
    owner: backlog-sync
    also_written_by:
      - { writer: story-clarifier, scope: 'changes the human confirmed at CLARIFICATION' }

  clarification:
    pattern: docs/stories/epic-{epic}/{story_id}/clarification.md
    owner: story-clarifier

  specification:
    pattern: docs/stories/epic-{epic}/{story_id}/spec.md
    owner: spec-writer

  specification_review:
    pattern: docs/stories/epic-{epic}/{story_id}/spec-review.md
    owner: spec-reviewer

  implementation_plan:
    pattern: docs/stories/epic-{epic}/{story_id}/plan.md
    owner: implementation-planner

  test_report:
    pattern: docs/stories/epic-{epic}/{story_id}/tests.md
    owner: test-writer

  implementation_report:
    pattern: docs/stories/epic-{epic}/{story_id}/implementation.md
    owner_by_layer:
      api: nest-implementor
      web: next-implementor

  review:
    pattern: docs/stories/epic-{epic}/{story_id}/review.md
    owner: story-reviewer

  # --- Workflow state --------------------------------------------------------
  workflow_state:
    pattern: docs/workflow/workflow-state.yaml
    owner: story-orchestrator

  workflow_history:
    pattern: docs/workflow/history.jsonl
    owner: story-orchestrator

# Example:
#   docs/stories/epic-03/
#     backlog.md  decisions.md
#     US-03-02-api/  story.md clarification.md spec.md spec-review.md
#                    plan.md tests.md implementation.md review.md
#     US-03-02-web/  ...
#   docs/stories/epic-00/US-00-01-web/ ...   foundation stories
